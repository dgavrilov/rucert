name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            test: true
          - os: macos-26
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            test: true
            exe: .exe
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Tests run once per OS on the native target; the other target is cross-compiled.
      - if: matrix.test
        run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rucert-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rucert${{ matrix.exe }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          # Artifacts do not preserve the executable bit.
          chmod +x artifacts/rucert-*-apple-darwin/rucert
          tar -czf "dist/rucert-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            -C artifacts/rucert-aarch64-apple-darwin rucert
          tar -czf "dist/rucert-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" \
            -C artifacts/rucert-x86_64-apple-darwin rucert
          zip -j "dist/rucert-${GITHUB_REF_NAME}-windows-x86_64.zip" \
            artifacts/rucert-x86_64-pc-windows-msvc/rucert.exe
          zip -j "dist/rucert-${GITHUB_REF_NAME}-windows-arm64.zip" \
            artifacts/rucert-aarch64-pc-windows-msvc/rucert.exe
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
