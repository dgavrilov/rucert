macos.system_trust: "Russian Trusted Root CA is also trusted in the macOS keychain, so all applications trust it for any site and the domain limits do not apply there. If you do not need it outside the browsers, you can remove it in Keychain Access (login and System keychains)."
windows.system_trust: "Russian Trusted Root CA is also in the Windows trusted root store, so all applications trust it for any site and the domain limits do not apply there. If you do not need it outside the browsers, you can remove it from Trusted Root Certification Authorities in certmgr.msc (current user) and certlm.msc (computer)."
