macos.system_trust: "Russian Trusted Root CA также отмечен доверенным в связке ключей macOS, поэтому ему доверяют все приложения для любых сайтов, и ограничение по доменам на них не распространяется. Если вне браузеров он не нужен, его можно удалить в «Связке ключей» (связки «вход» и «Система»)."
windows.system_trust: "Russian Trusted Root CA также находится в хранилище доверенных корневых сертификатов Windows, поэтому ему доверяют все приложения для любых сайтов, и ограничение по доменам на них не распространяется. Если вне браузеров он не нужен, его можно удалить из «Доверенных корневых центров сертификации» в certmgr.msc (текущий пользователь) и certlm.msc (компьютер)."
