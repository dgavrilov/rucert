[package]
name = "rucert"
version = "1.1.1"
edition = "2024"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
cliclack = { version = "=0.5.6", default-features = false }
console = { version = "=0.16.6", default-features = false, features = ["std"] }
dirs = { version = "=7.0.0", default-features = false }
idna = { version = "=1.1.0", default-features = false, features = ["alloc", "compiled_data"] }
plist = { version = "=1.10.3", default-features = false }
rust-i18n = { version = "=4.2.4", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.1", default-features = false }
sys-locale = { version = "=0.3.2", default-features = false }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
uuid = { version = "=1.29.0", default-features = false, features = ["v4"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1

[profile.release.package]
"*" = { opt-level = "z" }

[lints.rust]
warnings = { level = "deny", priority = -1 }
linker_messages = "allow"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_macros = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[lints.clippy]
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
undocumented_unsafe_blocks = "deny"
not_unsafe_ptr_arg_deref = "deny"
mem_forget = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
drop_non_drop = "deny"
uninit_vec = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
vec_init_then_push = "deny"
format_collect = "deny"
manual_memcpy = "deny"
needless_pass_by_value = "deny"
unnecessary_unwrap = "deny"
derive_partial_eq_without_eq = "deny"
derivable_impls = "deny"
clone_on_ref_ptr = "deny"
if_same_then_else = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
clone_on_copy = "deny"
useless_conversion = "deny"
vec_box = "deny"
boxed_local = "deny"
arc_with_non_send_sync = "deny"
manual_swap = "deny"
mem_replace_option_with_none = "deny"
redundant_locals = "deny"
manual_c_str_literals = "deny"
precedence = "deny"
implicit_saturating_sub = "deny"
ptr_eq = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[target."cfg(windows)".dependencies]
sha1 = { version = "=0.11.0", default-features = false }
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }
winreg = { version = "=0.56.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
